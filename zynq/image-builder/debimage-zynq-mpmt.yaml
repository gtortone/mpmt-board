{{- $suite := or .suite "bookworm" -}}
{{- $outdir := or .outdir "images" -}}
{{- $image := or .image "debian" -}}

architecture: armhf

actions:

  - action: debootstrap
    suite: "{{ $suite }}"
    components:
      - main
    mirror: https://deb.debian.org/debian
    variant: minbase

  - action: recipe
    recipe: recipes/packages-common.yaml

  - action: recipe
    recipe: recipes/packages-{{ $suite }}.yaml

  - action: run
    chroot: true
    command: echo zynq > /etc/hostname

  - action: run
    chroot: true
    command: pip3 install minimalmodbus cmd2==2.7.0 colorama smbus2 pymodbus==3.9.2 psutil uv --break-system-packages

  - action: overlay
    source: overlays/boot
    destination: /boot

  - action: overlay
    source: overlays/etc
    destination: /etc

  - action: overlay
    source: overlays/rauc
    destination: /

  - action: run
    chroot: true
    script: scripts/untar-modules.sh

  - action: run
    chroot: true
    script: scripts/install-zynq-info.sh

  - action: run
    chroot: true
    script: scripts/install-mpmt-mss.sh
    
  - action: run
    chroot: true
    script: scripts/install-mpmt-board-cli.sh

  - action: run
    chroot: true
    script: scripts/install-mpmt-readout.sh

  - action: run
    chroot: true
    command: mkdir -p /opt/fd-mpmt-scripts

  - action: overlay
    source: overlays/rc-tcp
    destination: /opt/fd-mpmt-scripts

  - action: run
    chroot: true
    command: mv /opt/fd-mpmt-scripts/rc_tcp.service /etc/systemd/system

  - action: run
    chroot: true
    command: cp /opt/mpmt-mss/contrib/systemd/mpmt-mss.service /etc/systemd/system

  - action: run
    chroot: true
    command: echo "en_US.UTF-8 UTF-8" > /etc/locale.gen; /usr/sbin/locale-gen; /usr/sbin/update-locale LANG=en_US.UTF-8

  - action: overlay
    source: overlays/sshd
    destination: /etc/ssh

  - action: overlay
    source: overlays/auth
    destination: /root/.ssh

  - action: overlay
    source: overlays/bash/bashrc
    destination: /root/.bashrc

  - action: overlay
    source: overlays/vim/vimrc
    destination: /root/.vimrc

  - action: overlay
    source: overlays/network
    destination: /

  - action: overlay
    source: overlays/rc
    destination: /etc

  - action: overlay
    source: overlays/scripts
    destination: /usr/bin

  - action: overlay
    source: overlays/firstboot
    destination: /

  - action: run
    chroot: true
    command: systemctl enable grow-rootfs.service

  - action: run
    chroot: true
    command: systemctl enable serial-getty@ttyPS0.service

  - action: run
    chroot: true
    command: systemctl enable rauc.service

  - action: run
    chroot: true
    command: systemctl enable data.mount

  - action: run
    chroot: true
    command: systemctl enable mpmt-mss.service

  - action: run
    chroot: true
    command: echo "ttyPS0" >> /etc/securetty

  - action: run
    chroot: true
    command: echo 'root:$1$TzpfaNEc$tjqCamkIJFUytJokydS8w.' | /usr/sbin/chpasswd -e

  - action: run
    chroot: false
    label: mkfs
    command: mke2fs -F -t ext4 -b 4096 -L rootfs -O ^orphan_file,^metadata_csum_seed -E root_owner=0:0 -d "$ROOTDIR" "$ARTIFACTDIR/{{ $outdir }}/rootfs.ext4" 3G

  - action: image-partition
    imagename: "{{ $outdir }}/{{ $image }}"
    imagesize: 3.0GB
    partitiontype: msdos
    mountpoints:
      - mountpoint: /
        partition: rootfs
    partitions:
      - name: rootfs
        features: ["^orphan_file", "^metadata_csum_seed"]
        fs: ext4
        start: 0%
        end: 100%

  - action: filesystem-deploy
    description: Deploying filesystem onto image

  - action: pack
    compression: none
    file: {{ $outdir }}/zynq-mpmt-debian-{{ $suite }}.tar

  - action: pack
    compression: gz
    file: {{ $outdir }}/zynq-mpmt-debian-{{ $suite }}.tar.gz

  - action: run
    chroot: false
    label: lz4
    command: lz4 --favor-decSpeed {{ $outdir }}/zynq-mpmt-debian-{{ $suite }}.tar {{ $outdir }}/zynq-mpmt-debian-{{ $suite }}.tar.lz4

